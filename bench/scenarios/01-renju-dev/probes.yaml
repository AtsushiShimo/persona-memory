# Scenario 01-renju-dev: 30 件の probe.
# after_turn 値 = この turn まで会話を流し込んだ直後で query を投げる.
# probe は (recall_required=true) を中心に, baseline (no_memory) との
# 差が出る配置にしている.

# ─── exact_fact 系 (= 数値 / 名前 / 配色等の単純再現) ─────────────
- id: "01-renju-dev:p01"
  after_turn: 50
  query: "結局、 盤サイズはどうしたんだっけ?"
  expected_keywords: ["15x15", "15×15", "15 x 15"]
  recall_required: true
  distance: far
  kind: exact_fact
  expected_answer: "15x15 盤を採用. 19x19 案は計算量で撤回."

- id: "01-renju-dev:p02"
  after_turn: 50
  query: "Renju の黒の禁手って何だったっけ? 3 つあったよね"
  expected_keywords: ["三三", "四四", "長連"]
  recall_required: true
  distance: far
  kind: exact_fact
  expected_answer: "三三禁 / 四四禁 / 長連禁 の 3 種類. 黒のみ適用."

- id: "01-renju-dev:p03"
  after_turn: 50
  query: "このプロジェクトの名前何にしたっけ?"
  expected_keywords: ["Gomoku-Five", "Gomoku Five"]
  recall_required: true
  distance: far
  kind: name
  expected_answer: "Gomoku-Five"

- id: "01-renju-dev:p04"
  after_turn: 50
  query: "AI 強さは何段階あった?"
  expected_keywords: ["5", "5 段階", "5段階", "level5", "LEVEL5"]
  recall_required: true
  distance: far
  kind: numerical
  expected_answer: "5 段階 (level1 〜 level5)."

- id: "01-renju-dev:p05"
  after_turn: 50
  query: "実装言語は?"
  expected_keywords: ["Python"]
  recall_required: true
  distance: mid
  kind: exact_fact
  expected_answer: "Python (描画は Pygame)."

# ─── decision / retraction / negation ─────────────────────────────
- id: "01-renju-dev:p06"
  after_turn: 50
  query: "オンライン対戦って付けたっけ?"
  expected_keywords: ["諦め", "やめ", "ローカル", "v1 はローカル", "見送", "却下", "つけてない", "付けてない"]
  recall_required: true
  distance: mid
  kind: negation
  expected_answer: "オンライン対戦は実装コスト過大で諦め. v1 はローカル限定."

- id: "01-renju-dev:p07"
  after_turn: 50
  query: "19x19 を見送った理由は?"
  expected_keywords: ["計算量"]
  recall_required: true
  distance: far
  kind: retraction
  expected_answer: "計算量問題で 19x19 → 15x15 に変更."

- id: "01-renju-dev:p08"
  after_turn: 50
  query: "評価関数の重み付け教えて"
  expected_keywords: ["1.0", "0.6", "0.4", "連結", "飛び", "抑え"]
  recall_required: true
  distance: mid
  kind: numerical
  expected_answer: "連結=1.0, 飛び=0.6, 抑え=0.4."

- id: "01-renju-dev:p09"
  after_turn: 50
  query: "先手はどっちにしたっけ?"
  expected_keywords: ["黒", "黒先"]
  recall_required: true
  distance: mid
  kind: exact_fact
  expected_answer: "黒先・白後手 (Renju 慣習)."

- id: "01-renju-dev:p10"
  after_turn: 50
  query: "開発期間の目標は?"
  expected_keywords: ["3 ヶ月", "3ヶ月", "三ヶ月"]
  recall_required: true
  distance: near
  kind: numerical
  expected_answer: "3 ヶ月."

